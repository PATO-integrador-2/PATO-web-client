<mat-drawer-container class="main-container" autosize>
  <mat-drawer mode="side" opened position="end" opened class="custom-sidebar">

    <div class="sidebar-body">
      <div class="header">
        <h1 class="title">Iniciar sesión</h1>
        <div class="subtext-container">
          <p class="account-copy account-copy-full">¿No tienes una cuenta?</p>
          <a routerLink="/register" class="link">Crea una justo ahora</a>
        </div>
      </div>

      <mat-form-field class="input-custom" appearance="outline">
        <mat-label>Correo</mat-label>
        <input matInput [formControl]="emailControl">
      </mat-form-field>
      <mat-form-field class="input-custom" appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hide() ? 'password' : 'text'" [formControl]="passwordControl" />
        <button matIconButton matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()">
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
      @if (errorMessage()) {
      <mat-error>{{ errorMessage() }}</mat-error>
      }

        <button type="button" matButton="filled" class="submit-container" (click)="login()">Iniciar Sesión</button>

        <a routerLink="/accountRecovery" class="link">¿Olvidaste tu contraseña?</a>

    </div>
  </mat-drawer>

  <mat-drawer-content >
    <img src="assets/img/pe.png">
  </mat-drawer-content>
</mat-drawer-container>
