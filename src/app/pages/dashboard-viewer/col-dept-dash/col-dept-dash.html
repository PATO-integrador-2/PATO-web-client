<app-navbar></app-navbar>
<app-navbar-dashboard></app-navbar-dashboard>

<div class="dashboard-layout">

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <header class="dashboard-header">
            <h1>Panel Multidimensional de Pobreza Colombia Regional</h1>
        </header>
        <br><br>

        <!-- RENDERIZADO DE WIDGETS -->
        <div class="dashboard-grid-dash">
            @for (widget of dashboardService.widgets(); track widget.id) {
            <div class="dashboard-card" [class.card-tall]="widget.id === 2" >

                <div class="card-header">
                    <h3>{{ widget.label }}</h3>

                    <button mat-icon-button type="button" class="filter-btn" (click)="onClickFilter(widget)"
                        aria-label="Filtrar">
                        <mat-icon>filter_list</mat-icon>
                    </button>
                </div><br>

                <div class="card-content">
                    <ng-container [ngComponentOutlet]="widget.content" />
                </div>

            </div>
            }
        </div>

    </main>

</div>
