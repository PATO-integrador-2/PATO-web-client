<div class="map-viewer-shell">
  <app-navbar></app-navbar>

  <div class="map-viewer-content">
    <main class="map-viewer-main">
      <app-map-element
        [location]="currentLocation()"
        (locationChange)="onMapLocationChange($event)"
        (colombiaLevelChange)="onColombiaLevelChange()"
        (locationAnchor)="onLocationAnchorChange($event)">
      </app-map-element>

      @if (panelOpen()) {
        <app-location-info-panel
          [locationName]="selectedName()"
          [location]="currentLocation()!"
          [level]="selectedLevel()"
          [metrics]="selectedMetrics()"
          (close)="closeLocationPanel()">
        </app-location-info-panel>
      }
    </main>
  </div>
</div>
