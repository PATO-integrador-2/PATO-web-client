<div #mapContainer class="map-container"></div>

@if (isLoading()) {
	<div class="map-loading" role="status" aria-live="polite" aria-label="Cargando mapa">
		<div class="map-loading__spinner" aria-hidden="true"></div>
		<span>Cargando mapa...</span>
	</div>
}

<div class="map-actions" aria-label="Controles del mapa">
	@if (location()?.pais === 'Colombia') {
		<div class="level-control" role="group" aria-label="Nivel geográfico">
			<button type="button" [class.is-active]="colombiaLevel === 'countries'" (click)="setColombiaLevel('countries')">País</button>
			<button type="button" [class.is-active]="colombiaLevel === 'regions'" (click)="setColombiaLevel('regions')">Región</button>
			<button type="button" [class.is-active]="colombiaLevel === 'departments'" (click)="setColombiaLevel('departments')">Departamento</button>
		</div>
	}

	<button type="button" class="map-action" (click)="goBackToLatinAmerica()">
		Volver a LATAM
	</button>
</div>

<div class="map-legend" aria-label="Leyenda de incidencia IPM">
	<div class="map-legend__title">Incidencia IPM</div>
	<div class="map-legend__gradient"></div>
	<div class="map-legend__labels">
		<span>0%</span>
		<span>20%</span>
		<span>40%</span>
		<span>60%</span>
		<span>100%</span>
	</div>
	<div class="map-legend__conditions">
		<span><i class="map-legend__swatch map-legend__swatch--green"></i>Verde: menor a 20%</span>
		<span><i class="map-legend__swatch map-legend__swatch--yellow"></i>Amarillo: 20% a 40%</span>
		<span><i class="map-legend__swatch map-legend__swatch--orange"></i>Naranja: 40% a 60%</span>
		<span><i class="map-legend__swatch map-legend__swatch--red"></i>Rojo: mayor a 60%</span>
		<span><i class="map-legend__swatch map-legend__swatch--gray"></i>Gris: sin datos</span>
	</div>
	<div class="map-legend__note">Periodo: Promedio histórico</div>
</div>
